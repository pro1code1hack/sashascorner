# The menu as published -- the website's source of truth for what is sold and at
# what price.
#
# Transcribed 2026-09-25 from:
#   drinks  -- the six TV-screen slides linked from the Google Business Profile
#              ("Menu", drive.google.com/file/d/1eCqAHGgahQQJVXy5ss8RS6cjXs7nMjj5)
#   autumn  -- the newer TV slide in the profile's Menu photos (hojicha, pumpkin spice)
#   food    -- the printed Breakfast / Lunch / Brunch menu the owner supplied
#   cakes   -- the ops database (menu_item), since no board lists them
#
# Spelling is corrected here, not copied ("matca", "pech", "Lemonad", "bibbles").
# Two conflicts on the boards were resolved and should be confirmed by the owner:
#   * Honey vanilla latte XL: feature panel says 3.40, the seasonal list 4.30 -> 4.30
#   * Passion fruit smoothie S: feature panel 3.90, the smoothie list 4.00  -> 4.00
#
# `sashasite doctor` compares these prices against the ops database (the POS
# side) and lists every disagreement. The two are expected to converge; until
# they do, the website shows what the café's own screens show.
#
# Format: each category declares its size columns; each item gives one price per
# column, in pounds, space-separated. `note`, `description`, `signature`,
# `seasonal` are optional.

