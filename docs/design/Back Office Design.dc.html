<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><meta name="design_doc_mode" content="canvas"><style>body{margin:0;background:#eceef2;font-family:system-ui,sans-serif}a{color:#1f2633}a:hover{color:#4a6fd1}.dv-turn{padding:40px 44px 32px}.dv-thd{display:flex;align-items:baseline;gap:10px;margin:0 0 24px}.dv-tid{font:600 10px ui-monospace,Menlo,monospace;padding:3px 7px;background:#1a1a1a;color:#fff;border-radius:4px;text-decoration:none}.dv-tname{font:600 13px/1.4 system-ui,sans-serif;color:#1a1a1a}.dv-opts{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}.dv-opt{flex:none;display:flex;flex-direction:column;gap:9px;scroll-margin-top:16px}.dv-oid{font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#1a1a1a;border-radius:5px;text-decoration:none}.dv-olabel{display:flex;align-items:baseline;gap:8px;font:400 12px/1.3 system-ui,sans-serif;color:rgba(0,0,0,.6)}.dv-card{max-width:100%;background:#fff;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08)}.dv-opt:target .dv-oid{background:#4a6fd1;color:#fff}</style></helmet>
<section class="dv-turn" id="t1">
<div class="dv-thd"><a class="dv-tid" href="#t1">1</a><span class="dv-tname">Sasha's Corner back office. One row per screen: iPad on the left, desktop on the right. Screens load when you tap them so the page stays fast. Drop a photo on any menu card.</span></div>
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
<div class="dv-opts" style="margin-bottom:40px">
<sc-for list="{{ r.frames }}" as="f" hint-placeholder-count="2">
<div class="dv-opt" id="{{ f.id }}"><div class="dv-olabel"><a class="dv-oid" href="#{{ f.id }}">{{ f.id }}</a>{{ f.label }}</div>
<div class="dv-card" style="width:{{ f.w }};height:{{ f.h }};border:{{ f.bd }};border-radius:{{ f.r }}">
<sc-if value="{{ f.live }}" hint-placeholder-val="{{ false }}"><dc-import name="Cafe Ops v2" skip-login="{{ f.skip }}" compact="{{ f.compact }}" start-page="{{ f.page }}" force-state="{{ f.force }}" hint-size="100%,100%" style="width:100%;height:100%"></dc-import></sc-if>
<sc-if value="{{ f.idle }}" hint-placeholder-val="{{ true }}"><div onClick="{{ f.load }}" style="cursor:pointer;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#f6f7fa;font-family:system-ui,sans-serif"><div style="font:700 22px system-ui,sans-serif;color:#1f2633">{{ f.title }}</div><div style="background:#4a6fd1;color:#fff;border-radius:12px;padding:10px 20px;font:600 14px system-ui,sans-serif">Tap to load</div></div></sc-if>
</div></div>
</sc-for>
</div>
</sc-for>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
const PAGES = [['stock','Stock',1],['menu','Menu items',1],['rec','Recipes',1],['orders','Orders',1],['ing','Ingredients',1],['sup','Suppliers',1],['m-overview','Money',1],['agents','Agents',1],['login','Sign in',0]];
class Component extends DCLogic {
  state = { live: { '1a': true } };
  renderVals() {
    const live = this.state.live;
    const fr = (id, title, label, page, ipad) => ({ id, title, label, page: page === 'login' ? 'stock' : page, force: page === 'login' ? 'login' : 'none', skip: page !== 'login', compact: ipad,
      w: ipad ? '1180px' : '1440px', h: ipad ? '820px' : '900px', bd: ipad ? '10px solid #1d1b19' : '1px solid rgba(0,0,0,.12)', r: ipad ? '36px' : '12px',
      live: !!live[id], idle: !live[id], load: () => this.setState(s => ({ live: { ...s.live, [id]: true } })) });
    return { rows: PAGES.map(([p, l, d], i) => ({ frames: [fr((i + 1) + 'a', l, l + ' · iPad', p, true), ...(d ? [fr((i + 1) + 'b', l, l + ' · Desktop', p, false)] : [])] })) };
  }
}
</script>
</body>
</html>
