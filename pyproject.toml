[project]
name = "cafeops"
version = "0.1.0"
description = "Inventory and auto-ordering for Sasha's Corner, Dundee"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3",
    "alembic>=1.20.0",
    "anthropic>=1.7.0",
    "apscheduler>=3.11.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0",
    "typer>=0.27.2",
    "uvicorn>=0.53.0",
]

[project.scripts]
cafeops = "cafeops.cli:app"

[dependency-groups]
dev = ["mypy>=2.3.1", "ruff>=0.16.8"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cafeops"
module-root = ""

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["cafeops"]
# Alembic owns the contents of versions/ -- autogenerated files should not fail
# the lint gate for style the template chose.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                 # isort
    "UP",                # pyupgrade
    "B",                 # bugbear
    "C4",                # comprehensions
    "DTZ",               # naive-datetime bans -- spec: all timestamps tz-aware UTC
    "RUF",
]
ignore = ["B008"]        # typer uses function calls in argument defaults

[tool.ruff.lint.per-file-ignores]
"migrations/env.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
ignore_missing_imports = true

# Spec section 1: mypy strict on domain/ and services/ only.
[[tool.mypy.overrides]]
module = ["cafeops.domain.*", "cafeops.services.*"]
strict = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["cafeops.db.*", "cafeops.integrations.*", "cafeops.bot.*", "cafeops.jobs.*", "cafeops.api.*", "cafeops.seed.*", "cafeops.cli"]
disallow_untyped_defs = false
