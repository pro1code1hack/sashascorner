[project]
name = "sashasite"
version = "0.1.0"
description = "Public website backend for Sasha's Corner, Dundee (menu, bookings, contact)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "email-validator>=2.2.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "typer>=0.27.2",
    "uvicorn>=0.53.0",
]

[project.scripts]
sashasite = "sashasite.cli:app"

[dependency-groups]
dev = ["mypy>=2.3.1", "ruff>=0.16.8"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sashasite"
module-root = ""

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["sashasite"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                 # isort
    "UP",                # pyupgrade
    "B",                 # bugbear
    "C4",                # comprehensions
    "DTZ",               # naive-datetime bans -- all timestamps tz-aware UTC
    "RUF",
]
ignore = ["B008"]        # FastAPI/typer use function calls in argument defaults

[tool.ruff.lint.per-file-ignores]
"migrations/env.py" = ["E501"]
# Owner notifications are written in Russian, like the ops bot. RUF001-3 exist to
# catch a Cyrillic homoglyph smuggled into ASCII; here the Cyrillic IS the text.
"sashasite/notify.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
strict = true
