# Every image position on the public site. Pages render a slot by key; an empty
# slot shows a branded placeholder with the label and hint below, so the owner can
# see on the live site which photo belongs where. Assign photos at /admin.
#
#   key       page.section[.name], lowercase, dots
#   label     shown in the admin and, small, in the placeholder
#   page      the page the slot appears on
#   aspect    the CSS aspect-ratio the page renders it at (crop with the focal point)
#   multiple  true => an ordered list (strips, galleries)
#   max       for multiple, the most the layout shows
#   hint      the photo to take: subject, framing, light. Shown in the placeholder.
#
# The front-end reads the export of this file (web/src/data/slots.json, written by
# `sashasite slots-export`). Adding a key here does nothing until a page renders it;
# removing one a page renders leaves that page showing a bare placeholder.

# ---- Home (/) -------------------------------------------------------------------

[[slot]]
key = "home.signatures"
label = "Home — signatures photo strip"
page = "/"
aspect = "4/5"
multiple = true
max = 4
hint = "One signature per frame — Raff coffee, iced honey blue matcha, honey vanilla latte, Kyiv cake slice — on a white table, from the side at cup height, window light"

[[slot]]
key = "home.mood"
label = "Home — the corner, four upright photos"
page = "/"
aspect = "2/3"
multiple = true
max = 4
hint = "Four upright moments: a drink, a cake, the room, the window. Phone held upright, daylight, no flash"

[[slot]]
key = "home.room"
label = "Home — the room, one wide photo"
page = "/"
aspect = "16/9"
multiple = false
max = 1
hint = "The whole room in one landscape frame: sage walls, dark panelling, white tables, strip lights on. From the counter end, late afternoon"

